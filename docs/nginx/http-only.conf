# 证书申请前使用：HTTP-only，提供 ACME challenge 路径
log_format welink_vhost '$host $remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log welink_vhost;
error_log  /var/log/nginx/error.log warn;

server {
    listen 80;
    server_name welink.click www.welink.click demo.welink.click;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
