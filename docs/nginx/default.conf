# 证书申请后使用：HTTP 重定向 + HTTPS
#
# Host 放在每行最前面，方便 GoAccess 按 welink.click / demo.welink.click
# 统计访问量，也方便 grep 单独分析某个站点。
log_format welink_vhost '$host $remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';
error_log  /var/log/nginx/error.log warn;

server {
    listen 80;
    server_name welink.click www.welink.click demo.welink.click;
    access_log /var/log/nginx/access.log welink_vhost;

    # Let's Encrypt 续期 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name welink.click www.welink.click;
    access_log /var/log/nginx/access.log welink_vhost;

    ssl_certificate     /etc/certs/fullchain.pem;
    ssl_certificate_key /etc/certs/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    root  /usr/share/nginx/html;
    index index.html;

    location /_stats/ {
        auth_basic "WeLink Traffic";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        alias /var/www/goaccess/welink/;
        index index.html;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

server {
    listen 443 ssl;
    server_name demo.welink.click;
    access_log /var/log/nginx/access.log welink_vhost;

    ssl_certificate     /etc/certs/fullchain.pem;
    ssl_certificate_key /etc/certs/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location /_stats/ {
        auth_basic "WeLink Demo Traffic";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        alias /var/www/goaccess/demo/;
        index index.html;
    }

    location / {
        proxy_pass         http://welink-frontend-demo:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
